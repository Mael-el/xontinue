# ============================================================
# CI — AfricaSkills
# Lint · Typecheck · Tests · Build (base PGlite embarquée)
# Déclenché sur push et pull request vers main.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test -- --ci

      - name: Démarrer la base embarquée (PGlite)
        run: |
          node scripts/embedded-db.mjs &
          npx wait-on tcp:127.0.0.1:5432 --timeout 30000
        env:
          EMBEDDED_DB_DIR: /tmp/pglite-ci

      - name: Pousser le schéma
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Build de production
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_POOL_MAX: "1"
          JWT_SECRET: ci-secret-ci-secret-ci-secret-32ch
          JWT_REFRESH_SECRET: ci-refresh-ci-refresh-ci-refresh-32c
